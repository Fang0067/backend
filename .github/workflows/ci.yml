name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check lockfiles are in sync
        run: |
          echo "Checking that package-lock.json is in sync with package.json (bun.lock is canonical)..."
          if [ -f package-lock.json ]; then
            cp package-lock.json package-lock.json.orig
            npm install --package-lock-only --ignore-scripts
            if ! diff -q package-lock.json package-lock.json.orig >/dev/null 2>&1; then
              echo "::error::package-lock.json is out of sync with package.json. Run 'npm install' locally after any 'bun add / bun update' and commit the updated lockfile."
              diff -u package-lock.json.orig package-lock.json | head -n 200 || true
              mv package-lock.json.orig package-lock.json
              exit 1
            fi
            echo "package-lock.json is in sync."
            rm package-lock.json.orig
          fi

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fail on high or critical vulnerabilities
        # Non-blocking until the axios advisories are resolvable: the remaining
        # high-severity findings live in @stellar/stellar-sdk 15.x's pinned axios
        # and are only fixed by a major SDK upgrade (17.x). Matches the audit
        # reporting convention in security-audit.yml. Re-enable the hard fail
        # once stellar-sdk is upgraded.
        run: npm audit --audit-level=high || true
